  supported_formats: |
    **Formats de fichiers supportés :**

    - **OFM** : extension `.xyz` avec au minimum les colonnes LON, LAT, DEPTH, TIME dans l'en-tête.
    - **DCDB** : extension `.csv` avec au minimum les colonnes LON, LAT, DEPTH, TIME dans l'en-tête.
    - **Lowrance** : extension `.csv` avec au minimum les colonnes Longitude[°WGS84], Latitude[°WGS84], WaterDepth[Feet], DateTime[UTC] dans l'en-tête. Ces fichiers proviennent de fichiers SL3 Lowrance exportés par l'outil [SL3Reader](https://github.com/halmaia/SL3Reader).
    - **Actisense** : à venir.
    - **BlackBox** : extension `.TXT` sans en-tête avec les colonnes dans l'ordre Time, Date, Latitude, Longitude, Speed (km/h) et Depth (m).
    - **[WIBL](https://github.com/CCOMJHC/WIBL/tree/main)** : extension numérique (ex. `.1`, `.2`, `.3`, etc.).
